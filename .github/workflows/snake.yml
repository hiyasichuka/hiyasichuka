name: Contribution snake

on:
  schedule:
    # 09:17 JST every day.
    - cron: '17 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/snake.yml
      - README.md
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - README.md

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: hiyasichuka
          outputs: |
            dist/github-snake.svg?color_snake=%23059669&color_dots=%23ebedf0,%23c6e9d6,%237bcfa2,%233baa78,%23059669
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2334d399&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2334d399
      - name: Store generated SVG animations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-snake
          path: |
            dist/github-snake.svg
            dist/github-snake-dark.svg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish contribution snake
    needs: generate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Publish generated SVG files to the profile-assets branch.
    steps:
      - name: Download generated SVG animations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contribution-snake
          path: dist
          digest-mismatch: error
      - name: Update profile assets branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const branch = 'profile-assets';
            let previous;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.object.sha });
              previous = commit;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const files = ['github-snake.svg', 'github-snake-dark.svg'];
            const entries = await Promise.all(files.map(async (path) => {
              const content = await fs.readFile(`dist/${path}`);
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: content.toString('base64'), encoding: 'base64',
              });
              return { path, mode: '100644', type: 'blob', sha: blob.sha };
            }));
            const { data: tree } = await github.rest.git.createTree({
              owner, repo, tree: entries,
              ...(previous ? { base_tree: previous.tree.sha } : {}),
            });
            if (tree.sha === previous?.tree.sha) {
              core.info('Contribution snake is already up to date.');
              return;
            }
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message: 'Update contribution snake', tree: tree.sha,
              parents: previous ? [previous.sha] : [],
            });
            if (previous) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
            }
